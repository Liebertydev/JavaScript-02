<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Border-box</title>
  <style>
    .caixa {
      width: 200px;
      height: 200px;
      padding: 20px;
      border: 5px solid green;
      background-color: lightgreen;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="caixa">Border-box</div>
</body>
</html>
